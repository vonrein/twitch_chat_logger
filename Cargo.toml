[package]
name = "twitch_chat_logger"
version = "0.1.0"
edition = "2021"


[dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
twitch-irc = { path = "twitch-irc_local", default-features = false, features = ["transport-tcp-rustls-webpki-roots"] }
anyhow = "1"
owo-colors = "4"
rustyline = "17"
notify-rust = "4"
rand = "0.9.2"


#tikv-jemallocator = "0.6"


chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
once_cell = "1.19"
home = "0.5.11"
[target.'cfg(unix)'.dependencies]
rodio = { version = "=0.21", default-features = true, features = ["playback", "symphonia-vorbis","symphonia-ogg"] }

chrono-tz = "0.10"

[profile.release]
codegen-units = 1     # Slower compile, but faster code
lto = "fat"           # Enable "Fat" Link-Time Optimization
panic = "abort"       # Reduces binary size by removing "unwinding" cleanup logic
strip = "symbols"     # Removes debug symbols to shrink the binary
opt-level = 3         # Maximum speed optimization (default for release, but good to be explicit)
